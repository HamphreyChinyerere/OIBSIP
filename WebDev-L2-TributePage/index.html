<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver Mtukudzi | Tribute</title>

     <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>
<body>

     <header class="hero">

        <img
            src="images/oliver-mtukudzi-hero.png"
            alt="Oliver Mtukudzi with his guitar"
            class="hero-image"
        >

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <p class="eyebrow">
                A Tribute To
            </p>

            <h1>
                Oliver
                <span>Mtukudzi</span>
            </h1>

            <div class="hero-line"></div>

            <p class="hero-description">
                Zimbabwean musician, cultural icon
                and storyteller.
            </p>

            <a
                href="#timeline"
                class="hero-button"
            >
                See Timeline
            </a>

        </div>

        <blockquote class="hero-quote">
            “My music is not for the government,
            my music is for the people.”
        </blockquote>

    </header>

    
</body>
</html>
