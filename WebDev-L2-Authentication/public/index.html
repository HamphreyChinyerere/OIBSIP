<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="LOCKR secure authentication system."
    >

    <title>LOCKR | Authentication System</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-visual">

            <div class="visual-overlay"></div>

            <div class="visual-glow visual-glow-one"></div>
            <div class="visual-glow visual-glow-two"></div>

            <div class="lockr-brand">

                <h1>
                    LOCKR
                </h1>

                <p>
                    Authentication System
                </p>

            </div>

        </section>

        <section class="auth-panel">

            <div class="panel-glow panel-glow-one"></div>
            <div class="panel-glow panel-glow-two"></div>

            <div class="auth-card">

                <div class="auth-card-header">

                    <div>

                        <p class="auth-label">
                            Secure Access
                        </p>

                        <h2 id="formTitle">
                            Welcome back
                        </h2>

                        <p
                            class="auth-description"
                            id="formDescription"
                        >
                            Enter your credentials to continue.
                        </p>

                    </div>

                    <button
                        class="theme-toggle"
                        id="themeToggle"
                        type="button"
                        aria-label="Toggle theme"
                    >
                        <i data-lucide="moon"></i>
                    </button>

                </div>

                <div
                    class="auth-tabs"
                    role="tablist"
                    aria-label="Authentication options"
                >

                    <button
                        class="auth-tab active"
                        id="loginTab"
                        type="button"
                        role="tab"
                        aria-selected="true"
                    >
                        Login
                    </button>

                    <button
                        class="auth-tab"
                        id="registerTab"
                        type="button"
                        role="tab"
                        aria-selected="false"
                    >
                        Register
                    </button>

                </div>

                <form
                    class="auth-form"
                    id="loginForm"
                >

                    <div class="form-group">

                        <label for="loginIdentifier">
                            Username or email
                        </label>

                        <div class="input-wrapper">

                            <i data-lucide="user"></i>

                            <input
                                type="text"
                                id="loginIdentifier"
                                name="identifier"
                                placeholder="Enter username or email"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="input-wrapper password-wrapper">

                            <i data-lucide="lock-keyhole"></i>

                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                class="password-toggle"
                                type="button"
                                data-password-target="loginPassword"
                                aria-label="Show password"
                            >
                                <i data-lucide="eye"></i>
                            </button>

                        </div>

                    </div>

                    <p
                        class="form-message"
                        id="loginMessage"
                        aria-live="polite"
                    ></p>

                    <button
                        class="primary-button"
                        type="submit"
                    >
                        <span>
                            Sign In
                        </span>

                        <i data-lucide="arrow-right"></i>
                    </button>

                </form>

                <form
                    class="auth-form"
                    id="registerForm"
                    hidden
                >

                    <div class="form-group">

                        <label for="registerUsername">
                            Username
                        </label>

                        <div class="input-wrapper">

                            <i data-lucide="user"></i>

                            <input
                                type="text"
                                id="registerUsername"
                                name="username"
                                placeholder="Choose a username"
                                autocomplete="username"
                                maxlength="30"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="registerEmail">
                            Email address
                        </label>

                        <div class="input-wrapper">

                            <i data-lucide="mail"></i>

                            <input
                                type="email"
                                id="registerEmail"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="input-wrapper password-wrapper">

                            <i data-lucide="lock-keyhole"></i>

                            <input
                                type="password"
                                id="registerPassword"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                class="password-toggle"
                                type="button"
                                data-password-target="registerPassword"
                                aria-label="Show password"
                            >
                                <i data-lucide="eye"></i>
                            </button>

                        </div>

                        <div class="password-requirements">

                            <span id="lengthRequirement">
                                At least 8 characters
                            </span>

                            <span id="numberRequirement">
                                Contains a number
                            </span>

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm password
                        </label>

                        <div class="input-wrapper password-wrapper">

                            <i data-lucide="shield-check"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Repeat your password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                class="password-toggle"
                                type="button"
                                data-password-target="confirmPassword"
                                aria-label="Show password"
                            >
                                <i data-lucide="eye"></i>
                            </button>

                        </div>

                    </div>

                    <p
                        class="form-message"
                        id="registerMessage"
                        aria-live="polite"
                    ></p>

                    <button
                        class="primary-button"
                        type="submit"
                    >
                        <span>
                            Create Account
                        </span>

                        <i data-lucide="user-plus"></i>
                    </button>

                </form>

                <p class="auth-switch-text">

                    <span id="switchPrompt">
                        Don't have an account?
                    </span>

                    <button
                        type="button"
                        id="switchAuthButton"
                    >
                        Register
                    </button>

                </p>

            </div>

        </section>

    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/auth.js"></script>

</body>

</html>
