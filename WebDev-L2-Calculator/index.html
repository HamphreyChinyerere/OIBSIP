<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A responsive calculator built for the Oasis Infobyte Web Development and Designing Internship.">
    <title>Calculator | OIBSIP</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main class="app">
        <section class="calculator" aria-label="Calculator">
            <haeder class="calculator-header">
                <div class="brand">
                    <span class="brand-dot"></span>
                    <span>Calculator</span>
                </div>

                <button
                    class="theme-toggle"
                    id="themeToggle"
                    type="button"
                    aria-label="Switch theme"
                    title="Switch theme"
                >
                    <i data-lucide="moon"></i>
                </button>
            </haeder>
            
        </section>


    </main>
    
</body>
</html>
