<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A responsive calculator built for the Oasis Infobyte Web Development and Designing Internship."
    >

    <title>Calculator | OIBSIP</title>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- ============================= -->
        <!-- Calculator -->
        <!-- ============================= -->

        <section
            class="calculator"
            aria-label="Calculator"
        >

            <!-- Calculator Header -->
            <header class="calculator-header">

                <div class="brand">
                    <span class="brand-dot"></span>
                    <span>Calculator</span>
                </div>

                <button
                    class="theme-toggle"
                    id="themeToggle"
                    type="button"
                    aria-label="Switch theme"
                    title="Switch theme"
                >
                    <i data-lucide="moon"></i>
                </button>

            </header>


            <!-- ============================= -->
            <!-- Display -->
            <!-- ============================= -->

            <section
                class="display"
                aria-label="Calculator display"
            >

                <div
                    class="previous-value"
                    id="previousValue"
                    aria-hidden="true"
                ></div>

                <div
                    class="current-value"
                    id="currentValue"
                    aria-live="polite"
                >
                    0
                </div>

            </section>


            <!-- ============================= -->
            <!-- Keypad -->
            <!-- ============================= -->

            <section
                class="keypad"
                aria-label="Calculator keypad"
            >

                <!-- ============================= -->
                <!-- Row 1 - Memory & Functions -->
                <!-- ============================= -->

                <button
                    class="calculator-button function-button"
                    data-action="memory-clear"
                    type="button"
                    aria-label="Memory clear"
                >
                    MC
                </button>

                <button
                    class="calculator-button function-button"
                    data-action="memory-recall"
                    type="button"
                    aria-label="Memory recall"
                >
                    MR
                </button>

                <button
                    class="calculator-button function-button"
                    data-action="memory-add"
                    type="button"
                    aria-label="Memory add"
                >
                    M+
                </button>

                <button
                    class="calculator-button function-button"
                    data-action="memory-subtract"
                    type="button"
                    aria-label="Memory subtract"
                >
                    M−
                </button>


                <!-- ============================= -->
                <!-- Row 2 - Functions & Divide -->
                <!-- ============================= -->

                <button
                    class="calculator-button function-button"
                    data-action="clear"
                    type="button"
                    aria-label="Clear calculator"
                >
                    C
                </button>

                <button
                    class="calculator-button function-button"
                    data-action="toggle-sign"
                    type="button"
                    aria-label="Toggle positive negative"
                >
                    +/−
                </button>

                <button
                    class="calculator-button function-button"
                    data-action="percentage"
                    type="button"
                    aria-label="Percentage"
                >
                    %
                </button>

                <button
                    class="calculator-button operator-button"
                    data-operation="divide"
                    type="button"
                    aria-label="Divide"
                >
                    ÷
                </button>


                <!-- ============================= -->
                <!-- Row 3 -->
                <!-- ============================= -->

                <button
                    class="calculator-button"
                    data-number="7"
                    type="button"
                >
                    7
                </button>

                <button
                    class="calculator-button"
                    data-number="8"
                    type="button"
                >
                    8
                </button>

                <button
                    class="calculator-button"
                    data-number="9"
                    type="button"
                >
                    9
                </button>

                <button
                    class="calculator-button operator-button"
                    data-operation="multiply"
                    type="button"
                    aria-label="Multiply"
                >
                    ×
                </button>


                <!-- ============================= -->
                <!-- Row 4 -->
                <!-- ============================= -->

                <button
                    class="calculator-button"
                    data-number="4"
                    type="button"
                >
                    4
                </button>

                <button
                    class="calculator-button"
                    data-number="5"
                    type="button"
                >
                    5
                </button>

                <button
                    class="calculator-button"
                    data-number="6"
                    type="button"
                >
                    6
                </button>

                <button
                    class="calculator-button operator-button"
                    data-operation="subtract"
                    type="button"
                    aria-label="Subtract"
                >
                    −
                </button>


                <!-- ============================= -->
                <!-- Row 5 -->
                <!-- ============================= -->

                <button
                    class="calculator-button"
                    data-number="1"
                    type="button"
                >
                    1
                </button>

                <button
                    class="calculator-button"
                    data-number="2"
                    type="button"
                >
                    2
                </button>

                <button
                    class="calculator-button"
                    data-number="3"
                    type="button"
                >
                    3
                </button>

                <button
                    class="calculator-button operator-button"
                    data-operation="add"
                    type="button"
                    aria-label="Add"
                >
                    +
                </button>


                <!-- ============================= -->
                <!-- Row 6 -->
                <!-- ============================= -->

                <button
                    class="calculator-button"
                    data-number="0"
                    type="button"
                >
                    0
                </button>

                <button
                    class="calculator-button"
                    data-action="decimal"
                    type="button"
                    aria-label="Decimal point"
                >
                    .
                </button>

                <button
                    class="calculator-button"
                    data-action="backspace"
                    type="button"
                    aria-label="Backspace"
                    title="Backspace"
                >
                    <i data-lucide="delete"></i>
                </button>

                <button
                    class="calculator-button equals-button"
                    data-action="equals"
                    type="button"
                    aria-label="Equals"
                >
                    =
                </button>

            </section>

        </section>


        <!-- ============================= -->
        <!-- Calculator History -->
        <!-- ============================= -->

        <aside
            class="history-panel"
            aria-label="Calculator history"
        >

            <!-- History Header -->
            <div class="history-header">

                <h2>History</h2>

                <button
                    class="history-clear"
                    id="clearHistory"
                    type="button"
                    aria-label="Clear calculator history"
                >
                    Clear
                </button>

            </div>


            <!-- History Items -->
            <div
                class="history-list"
                id="historyList"
            >

                <p class="history-empty">
                    No calculations yet
                </p>

            </div>

        </aside>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>

</body>

</html>
