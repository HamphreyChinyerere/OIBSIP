<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A responsive task management application built for the Oasis Infobyte Web Development internship."
    >

    <title>TaskFlow | To-Do App</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <header class="app-header">

            <div class="brand">

                <p class="brand-label">
                    Task Manager
                </p>

                <h1>
                    TaskFlow
                </h1>

                <p class="brand-description">
                    Organize your day and keep track of what matters.
                </p>

            </div>

            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Toggle dark mode"
            >
                <i data-lucide="moon"></i>
            </button>

        </header>

        <section class="task-entry">

            <form
                class="task-form"
                id="taskForm"
            >

                <label
                    for="taskInput"
                    class="task-label"
                >
                    Add a new task
                </label>

                <div class="task-input-wrapper">

                    <input
                        type="text"
                        id="taskInput"
                        class="task-input"
                        placeholder="What needs to be done?"
                        autocomplete="off"
                        maxlength="120"
                    >

                    <button
                        type="submit"
                        class="add-task-button"
                    >
                        <i data-lucide="plus"></i>
                        <span>Add Task</span>
                    </button>

                </div>

                <p
                    class="form-message"
                    id="formMessage"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
