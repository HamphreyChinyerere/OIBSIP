<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A responsive task management application built for the Oasis Infobyte Web Development internship."
    >

    <title>TaskFlow | To-Do App</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <header class="app-header">

            <div class="brand">

                <p class="brand-label">
                    Task Manager
                </p>

                <h1>
                    TaskFlow
                </h1>

                <p class="brand-description">
                    Organize your day and keep track of what matters.
                </p>

            </div>

            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Toggle dark mode"
            >
                <i data-lucide="moon"></i>
            </button>

        </header>

    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
